<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background-color: #000000;
  color: orange;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  font-size: 24px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.footer {
  text-align: center;
  padding: 20px 10px;
  font-size: 24px;
  background-color: #000000;
}

/* FOOTER BUTTONS */
.footer a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 18px;
  margin: 8px 10px;
  border: 2px solid #ff7f00;
  border-radius: 14px;
  color: #ffcc80;
  text-decoration: none;
  font-weight: bold;
  font-size: 18px;
  background: transparent;
  box-shadow: 0 0 12px rgba(255,127,0,.35);
  transition: 0.3s ease;
}

.footer a:hover {
  box-shadow: 0 0 22px rgba(255,127,0,.9);
  border-color: #ff9a2f;
  transform: scale(1.05);
  color: #ff7f00;
  text-decoration: none;
}

/* Desktop spacing */
@media (min-width: 601px) {
  .footer a {
    margin: 0 12px;
  }
}

/* Mobile: untereinander, aber nicht zu breit */
@media (max-width: 600px) {
  .footer a {
    display: block;
    width: fit-content;
    max-width: 90%;
    margin: 10px auto;
  }
}

.footer-info {
  margin-top: 20px;
  font-size: 16px;
  color: orange;
  line-height: 1.6;
}

/* OVERLAY */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  padding: 20px;
  box-sizing: border-box;
}

.overlay.active {
  display: flex;
}

/* BOOK */
.book {
  width: min(92vw, 700px);
  height: min(80vh, 520px);
  position: relative;
  perspective: 2500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.spine {
  position: absolute;
  width: 6%;
  height: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: #5a3a1d;
}

/* PAGES */
.page.left {
  position: absolute;
  width: 50%;
  height: 100%;
  left: 0;
  background: #fffdf5;
  border: 1px solid #d8c49a;
  padding: 18px;
  font-size: 16px;
  overflow-y: auto;
  box-sizing: border-box;
  line-height: 1.5;
}

.page.right {
  position: absolute;
  width: 50%;
  height: 100%;
  right: 0;
  transform-origin: left;
  transition: transform 1s ease;
  transform-style: preserve-3d;
}

.page.right .front,
.page.right .back {
  position: absolute;
  width: 100%;
  height: 100%;
  padding: 18px;
  font-size: 16px;
  box-sizing: border-box;
  overflow-y: auto;
  backface-visibility: hidden;
  line-height: 1.5;
}

.page.right .front {
  background: #fffdf5;
  border: 1px solid #d8c49a;
}

.page.right .back {
  background: #ffffff;
  transform: rotateY(180deg);
}

#leftPage,
#rightPage,
#rightPage .front,
#rightPage .back,
#leftPage *,
#rightPage * {
  color: #000 !important;
}

.page.turn {
  transform: rotateY(-180deg);
}

/* MAGNIFIER */
.magnifier {
  position: absolute;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 4px solid #ffcc80;
  background: rgba(255,255,255,0.25);
  box-shadow: 0 0 12px rgba(255,140,0,0.4);
  pointer-events: none;
  display: none;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: moveMagnifier 1.8s ease-in-out;
}

@keyframes moveMagnifier {
  0% { transform: translate(-120%, 80%); }
  50% { transform: translate(140%, -40%); }
  100% { transform: translate(-50%, -50%); }
}


/* =========================================================
   CURSOR-SYSTEM – REFERENZ
   ========================================================= */

.glitzer {
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 99999;
    width: var(--size);
    height: var(--size);
    opacity: 0;
    transform: translate(-50%, -50%);
    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #fffde8 10%,
            var(--color) 28%,
            rgba(255,180,0,.60) 45%,
            transparent 72%
        );
    border-radius: 50%;
    filter:
        drop-shadow(0 0 3px var(--color))
        drop-shadow(0 0 7px var(--color))
        drop-shadow(0 0 12px rgba(255,150,0,.45));
    animation:
        cursorTrail
        var(--duration)
        cubic-bezier(.15,.55,.25,1)
        forwards;
}

.glitzer::before,
.glitzer::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.glitzer::before {
    width: 185%;
    height: 14%;
    background:
        linear-gradient(
            to right,
            transparent,
            rgba(255,255,255,.10),
            var(--color),
            #ffffff,
            var(--color),
            rgba(255,255,255,.10),
            transparent
        );
    border-radius: 999px;
    filter: blur(.3px);
}

.glitzer::after {
    width: 14%;
    height: 185%;
    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,.10),
            var(--color),
            #ffffff,
            var(--color),
            rgba(255,255,255,.10),
            transparent
        );
    border-radius: 999px;
    filter: blur(.3px);
}

.glitzer.long {
    filter:
        drop-shadow(0 0 4px #ffffff)
        drop-shadow(0 0 7px var(--color))
        drop-shadow(0 0 13px var(--color))
        drop-shadow(0 0 19px rgba(255,145,0,.35));
}

.staub {
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 99998;
    width: var(--staub-size);
    height: var(--staub-size);
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.72) 0%,
            var(--color) 28%,
            rgba(255,170,0,.42) 55%,
            transparent 100%
        );
    transform: translate(-50%, -50%);
    opacity: 0;
    box-shadow:
        0 0 4px var(--color),
        0 0 9px var(--color),
        0 0 16px rgba(255,150,0,.42),
        0 0 24px rgba(255,170,0,.18);
    animation:
        staubTrail
        var(--duration)
        ease-out
        forwards;
}

@keyframes cursorTrail {
    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(var(--sx), var(--sy))
            scale(.18);
    }
    10% {
        opacity: .95;
        transform:
            translate(-50%, -50%)
            translate(var(--sx), var(--sy))
            scale(1);
    }
    30% {
        opacity: .85;
        transform:
            translate(-50%, -50%)
            translate(var(--mx), var(--my))
            scale(.9);
    }
    60% {
        opacity: .48;
        transform:
            translate(-50%, -50%)
            translate(var(--ex), var(--ey))
            scale(.55);
    }
    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(var(--ex), var(--ey))
            scale(.08);
    }
}

@keyframes staubTrail {
    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(0,0)
            scale(.2);
    }
    20% {
        opacity: .8;
        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--dx) * .25),
                calc(var(--dy) * .25)
            )
            scale(1);
    }
    65% {
        opacity: .55;
        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--dx) * .65),
                calc(var(--dy) * .65)
            )
            scale(.8);
    }
    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(
                var(--dx),
                var(--dy)
            )
            scale(.2);
    }
}

.klick-flash {
    position: fixed;
    left: 0;
    top: 0;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 100000;
    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #fff6a0 25%,
            #ffd000 50%,
            #ff7800 75%,
            transparent 100%
        );
    box-shadow:
        0 0 5px #fff000,
        0 0 12px #ffad00,
        0 0 22px #ff6500;
    transform:
        translate(-50%, -50%)
        scale(0);
    animation:
        flash .42s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes flash {
    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(0);
    }
    15% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.8);
    }
    45% {
        opacity: .8;
        transform:
            translate(-50%, -50%)
            scale(1);
    }
    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.15);
    }
}
</style>
</head>

<body>

<div class="footer" id="sourceContainer">

  <a href="https://www.sunnysschaetze.de/home/rechtliche-hinweise/impressum" onclick="openBook(event, this)">Impressum</a>
  <a href="https://www.sunnysschaetze.de/home/rechtliche-hinweise/agb" onclick="openBook(event, this)">AGB</a>
  <a href="https://www.sunnysschaetze.de/home/rechtliche-hinweise/datenschutz" onclick="openBook(event, this)">Datenschutz</a>
  <a href="https://www.sunnysschaetze.de/home/rechtliche-hinweise/widerrufsbelehrung" onclick="openBook(event, this)">Widerrufsbelehrung</a>
  <a href="https://www.sunnysschaetze.de/home/rechtliche-hinweise/barrierefreiheitserkl%C3%A4rung" onclick="openBook(event, this)">Barrierefreiheit</a>

  <div class="footer-info">
    Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.<br><br>
    Hinweis:<br>
    Es wird kein stationäres Ladengeschäft betrieben.<br>
    Verkauf und Ankauf erfolgen ausschließlich online sowie nach individueller Terminvereinbarung.
  </div>

</div>

<div class="overlay" id="overlay">

  <div class="book">

    <div class="spine"></div>

    <div class="page left" id="leftPage"></div>

    <div class="page right" id="rightPage">
      <div class="front"></div>
      <div class="back"></div>
    </div>

    <div class="magnifier" id="magnifier"></div>

  </div>

</div>

<script>
function openBook(event, link) {
  event.preventDefault();

  const overlay = document.getElementById("overlay");
  const container = document.getElementById("sourceContainer");

  const left = document.getElementById("leftPage");
  const rightPage = document.getElementById("rightPage");
  const front = document.querySelector(".front");
  const back = document.querySelector(".back");
  const magnifier = document.getElementById("magnifier");

  overlay.classList.add("active");

  const fullContent = container.innerHTML;

  left.innerHTML = "<h3>Rechtliche Hinweise</h3>" + fullContent;
  front.innerHTML = fullContent;
  back.innerHTML = "";

  magnifier.style.display = "block";
  magnifier.style.animation = "none";
  void magnifier.offsetWidth;
  magnifier.style.animation = "moveMagnifier 1.8s ease-in-out";

  setTimeout(() => {
    rightPage.classList.add("turn");
  }, 400);

  setTimeout(() => {
    window.open(link.href, "_blank");
  }, 1800);

  setTimeout(() => {
    rightPage.classList.remove("turn");
    overlay.classList.remove("active");
    magnifier.style.display = "none";
  }, 2600);
}


/* =========================================================
   CURSOR-SYSTEM – REFERENZ
   ========================================================= */

let letzteX = 0;
let letzteY = 0;
let letzterSpawn = 0;
let aktiveGlitzer = 0;
const MAX_GLITZER = 180;

document.addEventListener(
    "mousemove",
    function(event) {
        erzeugeBewegungsEffekt(
            event.clientX,
            event.clientY
        );
    }
);

document.addEventListener(
    "touchmove",
    function(event) {
        if (!event.touches || !event.touches.length) {
            return;
        }

        const touch = event.touches[0];

        erzeugeBewegungsEffekt(
            touch.clientX,
            touch.clientY
        );
    },
    {
        passive: true
    }
);

document.addEventListener(
    "click",
    function(event) {
        klickEffekt(
            event.clientX,
            event.clientY
        );
    }
);

function erzeugeBewegungsEffekt(x, y) {

    const dx = x - letzteX;
    const dy = y - letzteY;

    const entfernung = Math.sqrt(
        dx * dx +
        dy * dy
    );

    const jetzt = performance.now();

    if (entfernung < 2) {
        return;
    }

    if (jetzt - letzterSpawn < 12) {
        letzteX = x;
        letzteY = y;
        return;
    }

    if (aktiveGlitzer >= MAX_GLITZER) {
        letzteX = x;
        letzteY = y;
        return;
    }

    const nx = dx / entfernung;
    const ny = dy / entfernung;

    const trailX = x;
    const trailY = y;

    createGlitzer(
        trailX,
        trailY,
        false,
        nx,
        ny
    );

    createStaub(trailX, trailY);
    createStaub(trailX, trailY);
    createStaub(
        trailX - nx * 6,
        trailY - ny * 6
    );
    createStaub(
        trailX - nx * 12,
        trailY - ny * 12
    );
    createStaub(
        trailX - nx * 25,
        trailY - ny * 25
    );
    createStaub(
        trailX - nx * 40,
        trailY - ny * 40
    );

    if (Math.random() > .68) {
        createGlitzer(
            trailX,
            trailY,
            true,
            nx,
            ny
        );
    }

    if (entfernung > 15) {

        createStaub(
            trailX,
            trailY
        );

        createStaub(
            trailX - nx * 15,
            trailY - ny * 15
        );

        createStaub(
            trailX - nx * 30,
            trailY - ny * 30
        );

        if (entfernung > 28) {

            createStaub(
                trailX - nx * 45,
                trailY - ny * 45
            );

            createStaub(
                trailX - nx * 60,
                trailY - ny * 60
            );
        }
    }

    letzterSpawn = jetzt;
    letzteX = x;
    letzteY = y;
}

function createGlitzer(
    x,
    y,
    grosser = false,
    nx = 0,
    ny = 0
) {

    if (aktiveGlitzer >= MAX_GLITZER) {
        return;
    }

    const element = document.createElement("div");

    element.className =
        grosser
            ? "glitzer long"
            : "glitzer";

    const color =
        Math.random() > .5
            ? "#ff8500"
            : "#ffe000";

    const size =
        grosser
            ? 10 + Math.random() * 5
            : 4 + Math.random() * 4;

    element.style.setProperty(
        "--color",
        color
    );

    element.style.setProperty(
        "--size",
        size + "px"
    );

    const seitlich =
        (Math.random() - .5) * 5;

    const px = -ny;
    const py = nx;

    const sx = px * seitlich;
    const sy = py * seitlich;

    const mx =
        sx -
        nx * (16 + Math.random() * 16);

    const my =
        sy -
        ny * (16 + Math.random() * 16);

    const ex =
        mx -
        nx * (32 + Math.random() * 35) +
        (Math.random() - .5) * 5;

    const ey =
        my -
        ny * (32 + Math.random() * 35) +
        (Math.random() - .5) * 5;

    element.style.setProperty(
        "--sx",
        sx + "px"
    );

    element.style.setProperty(
        "--sy",
        sy + "px"
    );

    element.style.setProperty(
        "--mx",
        mx + "px"
    );

    element.style.setProperty(
        "--my",
        my + "px"
    );

    element.style.setProperty(
        "--ex",
        ex + "px"
    );

    element.style.setProperty(
        "--ey",
        ey + "px"
    );

    const duration =
        900 + Math.random() * 550;

    element.style.setProperty(
        "--duration",
        duration + "ms"
    );

    element.style.left =
        x + "px";

    element.style.top =
        y + "px";

    aktiveGlitzer++;

    document.body.appendChild(element);

    setTimeout(() => {

        element.remove();
        aktiveGlitzer--;

    }, duration + 60);
}

function createStaub(x, y) {

    if (aktiveGlitzer >= MAX_GLITZER) {
        return;
    }

    const element =
        document.createElement("div");

    element.className = "staub";

    const color =
        Math.random() > .5
            ? "#ff8500"
            : "#ffe000";

    element.style.setProperty(
        "--color",
        color
    );

    const size =
        1.5 + Math.random() * 2.5;

    element.style.setProperty(
        "--staub-size",
        size + "px"
    );

    const startX =
        (Math.random() - .5) * 20;

    const startY =
        (Math.random() - .5) * 20;

    const dx =
        (Math.random() - .5) * 48;

    const dy =
        (Math.random() - .5) * 48;

    element.style.left =
        (x + startX) + "px";

    element.style.top =
        (y + startY) + "px";

    element.style.setProperty(
        "--dx",
        dx + "px"
    );

    element.style.setProperty(
        "--dy",
        dy + "px"
    );

    const duration =
        650 + Math.random() * 550;

    element.style.setProperty(
        "--duration",
        duration + "ms"
    );

    aktiveGlitzer++;

    document.body.appendChild(element);

    setTimeout(() => {

        element.remove();
        aktiveGlitzer--;

    }, duration + 60);
}

function klickEffekt(x, y) {

    const flash =
        document.createElement("div");

    flash.className =
        "klick-flash";

    flash.style.left =
        x + "px";

    flash.style.top =
        y + "px";

    document.body.appendChild(flash);

    for (let i = 0; i < 18; i++) {

        createExplosionsGlitzer(
            x,
            y,
            Math.random() > .65
        );

        createExplosionStaub(
            x,
            y
        );
    }

    setTimeout(() => {
        flash.remove();
    }, 500);
}

function createExplosionsGlitzer(
    x,
    y,
    grosser = false
) {

    if (aktiveGlitzer >= MAX_GLITZER) {
        return;
    }

    const element =
        document.createElement("div");

    element.className =
        grosser
            ? "glitzer long"
            : "glitzer";

    const color =
        Math.random() > .5
            ? "#ff8500"
            : "#ffe000";

    const size =
        grosser
            ? 13 + Math.random() * 8
            : 7 + Math.random() * 7;

    element.style.setProperty(
        "--color",
        color
    );

    element.style.setProperty(
        "--size",
        size + "px"
    );

    const winkel =
        Math.random() * Math.PI * 2;

    const distance =
        grosser
            ? 55 + Math.random() * 55
            : 35 + Math.random() * 70;

    const sx =
        (Math.random() - .5) * 6;

    const sy =
        (Math.random() - .5) * 6;

    const mx =
        Math.cos(winkel) *
        distance *
        .45;

    const my =
        Math.sin(winkel) *
        distance *
        .45;

    const ex =
        Math.cos(winkel) *
        distance;

    const ey =
        Math.sin(winkel) *
        distance;

    element.style.setProperty(
        "--sx",
        sx + "px"
    );

    element.style.setProperty(
        "--sy",
        sy + "px"
    );

    element.style.setProperty(
        "--mx",
        mx + "px"
    );

    element.style.setProperty(
        "--my",
        my + "px"
    );

    element.style.setProperty(
        "--ex",
        ex + "px"
    );

    element.style.setProperty(
        "--ey",
        ey + "px"
    );

    const duration =
        500 + Math.random() * 350;

    element.style.setProperty(
        "--duration",
        duration + "ms"
    );

    element.style.left =
        x + "px";

    element.style.top =
        y + "px";

    aktiveGlitzer++;

    document.body.appendChild(element);

    setTimeout(() => {

        element.remove();
        aktiveGlitzer--;

    }, duration + 60);
}

function createExplosionStaub(x, y) {

    if (aktiveGlitzer >= MAX_GLITZER) {
        return;
    }

    const element =
        document.createElement("div");

    element.className = "staub";

    const color =
        Math.random() > .5
            ? "#ff8500"
            : "#ffe000";

    element.style.setProperty(
        "--color",
        color
    );

    const size =
        3 + Math.random() * 4;

    element.style.setProperty(
        "--staub-size",
        size + "px"
    );

    const winkel =
        Math.random() * Math.PI * 2;

    const distance =
        35 + Math.random() * 75;

    const dx =
        Math.cos(winkel) *
        distance;

    const dy =
        Math.sin(winkel) *
        distance;

    element.style.left =
        x + "px";

    element.style.top =
        y + "px";

    element.style.setProperty(
        "--dx",
        dx + "px"
    );

    element.style.setProperty(
        "--dy",
        dy + "px"
    );

    const duration =
        450 + Math.random() * 400;

    element.style.setProperty(
        "--duration",
        duration + "ms"
    );

    aktiveGlitzer++;

    document.body.appendChild(element);

    setTimeout(() => {

        element.remove();
        aktiveGlitzer--;

    }, duration + 60);
}
</script>

</body>
</html>
