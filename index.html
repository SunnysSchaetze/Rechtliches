<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background-color: #000000;
  color: orange;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  font-size: 24px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.footer {
  text-align: center;
  padding: 20px 10px;
  font-size: 24px;
  background-color: #000000;
}

/* FOOTER BUTTONS */
.footer a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 18px;
  margin: 8px 10px;
  border: 2px solid #ff7f00;
  border-radius: 14px;
  color: #ffcc80;
  text-decoration: none;
  font-weight: bold;
  font-size: 18px;
  background: transparent;
  box-shadow: 0 0 12px rgba(255,127,0,.35);
  transition: 0.3s ease;
}

.footer a:hover {
  box-shadow: 0 0 22px rgba(255,127,0,.9);
  border-color: #ff9a2f;
  transform: scale(1.05);
  color: #ff7f00;
  text-decoration: none;
}

/* Desktop spacing */
@media (min-width: 601px) {
  .footer a {
    margin: 0 12px;
  }
}

/* Mobile: untereinander, aber nicht zu breit */
@media (max-width: 600px) {
  .footer a {
    display: block;
    width: fit-content;
    max-width: 90%;
    margin: 10px auto;
  }
}

.footer-info {
  margin-top: 20px;
  font-size: 16px;
  color: orange;
  line-height: 1.6;
}

/* OVERLAY */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  padding: 20px;
  box-sizing: border-box;
}

.overlay.active {
  display: flex;
}

/* BOOK */
.book {
  width: min(92vw, 700px);
  height: min(80vh, 520px);
  position: relative;
  perspective: 2500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.spine {
  position: absolute;
  width: 6%;
  height: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: #5a3a1d;
}

/* PAGES */
.page.left {
  position: absolute;
  width: 50%;
  height: 100%;
  left: 0;
  background: #fffdf5;
  border: 1px solid #d8c49a;
  padding: 18px;
  font-size: 16px;
  overflow-y: auto;
  box-sizing: border-box;
  line-height: 1.5;
}

.page.right {
  position: absolute;
  width: 50%;
  height: 100%;
  right: 0;
  transform-origin: left;
  transition: transform 1s ease;
  transform-style: preserve-3d;
}

.page.right .front,
.page.right .back {
  position: absolute;
  width: 100%;
  height: 100%;
  padding: 18px;
  font-size: 16px;
  box-sizing: border-box;
  overflow-y: auto;
  backface-visibility: hidden;
  line-height: 1.5;
}

.page.right .front {
  background: #fffdf5;
  border: 1px solid #d8c49a;
}

.page.right .back {
  background: #ffffff;
  transform: rotateY(180deg);
}

#leftPage,
#rightPage,
#rightPage .front,
#rightPage .back,
#leftPage *,
#rightPage * {
  color: #000 !important;
}

.page.turn {
  transform: rotateY(-180deg);
}

/* MAGNIFIER */
.magnifier {
  position: absolute;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 4px solid #ffcc80;
  background: rgba(255,255,255,0.25);
  box-shadow: 0 0 12px rgba(255,140,0,0.4);
  pointer-events: none;
  display: none;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: moveMagnifier 1.8s ease-in-out;
}

@keyframes moveMagnifier {
  0% { transform: translate(-120%, 80%); }
  50% { transform: translate(140%, -40%); }
  100% { transform: translate(-50%, -50%); }
}
</style>
</head>

<body>

<div class="footer" id="sourceContainer">

  <a href="https://sites.google.com/view/sunnysschaetze/home/rechtliche-hinweise/impressum" onclick="openBook(event, this)">Impressum</a>
  <a href="https://sites.google.com/view/sunnysschaetze/home/rechtliche-hinweise/agb" onclick="openBook(event, this)">AGB</a>
  <a href="https://sites.google.com/view/sunnysschaetze/home/rechtliche-hinweise/datenschutz" onclick="openBook(event, this)">Datenschutz</a>
  <a href="https://sites.google.com/view/sunnysschaetze/home/rechtliche-hinweise/widerrufsbelehrung" onclick="openBook(event, this)">Widerrufsbelehrung</a>
  <a href="https://sites.google.com/view/sunnysschaetze/home/rechtliche-hinweise/barrierefreiheitserkl%C3%A4rung" onclick="openBook(event, this)">Barrierefreiheit</a>

  <div class="footer-info">
    Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.<br><br>
    Hinweis:<br>
    Es wird kein stationäres Ladengeschäft betrieben.<br>
    Verkauf und Ankauf erfolgen ausschließlich online sowie nach individueller Terminvereinbarung.
  </div>

</div>

<div class="overlay" id="overlay">

  <div class="book">

    <div class="spine"></div>

    <div class="page left" id="leftPage"></div>

    <div class="page right" id="rightPage">
      <div class="front"></div>
      <div class="back"></div>
    </div>

    <div class="magnifier" id="magnifier"></div>

  </div>

</div>

<script>
function openBook(event, link) {
  event.preventDefault();

  const overlay = document.getElementById("overlay");
  const container = document.getElementById("sourceContainer");

  const left = document.getElementById("leftPage");
  const rightPage = document.getElementById("rightPage");
  const front = document.querySelector(".front");
  const back = document.querySelector(".back");
  const magnifier = document.getElementById("magnifier");

  overlay.classList.add("active");

  const fullContent = container.innerHTML;

  left.innerHTML = "<h3>Rechtliche Hinweise</h3>" + fullContent;
  front.innerHTML = fullContent;
  back.innerHTML = "";

  magnifier.style.display = "block";
  magnifier.style.animation = "none";
  void magnifier.offsetWidth;
  magnifier.style.animation = "moveMagnifier 1.8s ease-in-out";

  setTimeout(() => {
    rightPage.classList.add("turn");
  }, 400);

  setTimeout(() => {
    window.open(link.href, "_blank");
  }, 1800);

  setTimeout(() => {
    rightPage.classList.remove("turn");
    overlay.classList.remove("active");
    magnifier.style.display = "none";
  }, 2600);
}
</script>

</body>
</html>
